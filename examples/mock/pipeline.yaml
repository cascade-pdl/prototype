# The scattered pipeline: source emits int[], detect fans out over the integers.
#
# The fan width is a property of the stored collection, so it is only known at run
# time, once `source` has written its output.
entrypoint: main

types:
  structures:
    - name: Detection
      fields:
        - { name: number, type: "int" }
        - { name: score,  type: "float" }

input: []

refs:
  - name: source
    runner: subprocess
    resources: { cpu: 0.5, memory: 256MiB }
    config: { cmd: ["python", "mock_source.py"] }
    input: []
    output: [ { name: numbers, type: "int[]" } ]

  - name: detect
    runner: subprocess
    resources: { cpu: 0.5, memory: 256MiB }
    config: { cmd: ["python", "mock_detect.py"] }
    input:  [ { name: number,     type: "int" } ]
    output: [ { name: detections, type: "Detection[]" } ]

dags:
  - name: main
    input: []
    nodes:
      - name: src
        runs: source
        args: { count: 10 }
      - name: det
        runs: detect
        scatter: number
        depends_on: [ { node: src, field: numbers, as: number } ]
    output: [ { node: det, field: detections, as: detections } ]