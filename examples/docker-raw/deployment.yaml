# This machine: a file store beside the project, docker on the local backend.
name: local

store:
  kind: file
  config:
    root: ./_store

backends:
  - name: local
    kind: local
    max: { cpu: 4, memory: 8GiB }
    concurrency: 4
    config:
      # the unpacked bundle from bundle/build.sh, mounted read-only into every wrapped
      # container at /opt/cascade; relative to this directory
      bundle: ../../dist/bundle/opt-cascade
      no_pull: false
