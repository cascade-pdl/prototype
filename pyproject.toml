[project]
name = "cascade-pdl"
version = "0.1.0"
description = ""
authors = [
    {name = "Lorenzo Trojan",email = "ltrojan@wildersensing.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)"
]

[project.scripts]
cascade = "cascade.cli:main"

[tool.poetry]
packages = [{ include = "cascade" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.emacs]
optional = true
[tool.poetry.group.emacs.dependencies]
python-lsp-server = "^1.14.0"
debugpy = "^1.8.21"
rope = "^1.14.0"
pylsp-rope = "^0.1.17"
python-lsp-black = "^2.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
ruff = "^0.16.3"

[tool.ruff]
target-version = "py313"
 
[tool.ruff.lint]
# The correctness subset only: F catches undefined names (F821) and unused imports
# (F401) -- the two halves of the bug that 232 passing tests could not see, because a
# dead function's body is never executed and `from __future__ import annotations` makes
# its annotations lazy strings. E9 catches syntax and IO errors. Style rules are
# deliberately left out: a linter that fails on day one gets ignored.
select = ["F", "E9"]